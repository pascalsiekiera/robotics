# slam_toolbox (sync mode), task 1b: build a map from the dataset's /scan + odometry.
# Replaces gmapping, which is not released for ROS 2 Jazzy.
# Based on slam_toolbox/config/mapper_params_online_sync.yaml; values changed from
# the defaults are marked with  <-- and the reason.
#
# How it works (short): every time the robot has moved far enough, the new scan
# is aligned against the previous ones (scan matching) to correct the odometry.
# Each aligned scan becomes a node of a pose graph. When the robot comes back to a
# known place, a loop closure adds a constraint between old and new nodes and the
# whole graph is re-optimised (Ceres solver). The occupancy grid is re-drawn from
# the optimised poses.

slam_toolbox:
  ros__parameters:
    # solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # frames and topics
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    use_map_saver: true
    use_lifecycle_manager: true   # <-- started by nav2_lifecycle_manager in the launch file

    debug_logging: false
    throttle_scans: 1             # use every scan (only ~5 Hz)
    transform_publish_period: 0.02
    map_update_interval: 2.0      # <-- 5.0; redraw the map more often, the run is only 2 min
    resolution: 0.05              # m per cell, same as the provided map
    min_laser_range: 0.12         # <-- LDS-01 minimum range
    max_laser_range: 3.5          # <-- 20.0; LDS-01 maximum range
    minimum_time_interval: 0.2    # <-- 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # when is a scan added to the pose graph
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2  # <-- 0.5; small arena (~3 m), add scans more often
    minimum_travel_heading: 0.2   # <-- 0.5 rad
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 3.5   # <-- 10.0; matches the laser range
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # correlative scan matcher: search window around the odometry guess
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # how strongly the matcher penalises moving away from the odometry guess
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
