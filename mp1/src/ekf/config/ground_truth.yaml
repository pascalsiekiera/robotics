# ground_truth_node: mocap -> robot pose in map. Used by all dataset tasks (1a, 1b, 1c).

ground_truth_node:
  ros__parameters:
    world_frame: map
    downsampled_rate: 1.0       # Hz, as required by the assignment
    sigma_xy: 0.02              # m, covariance attached to the 1 Hz ground truth
    sigma_yaw: 0.03             # rad
    # drop mocap samples that jump more than  max_jump + max_rate * dt
    max_jump_xy: 0.05
    max_speed: 0.5
    max_jump_yaw: 0.3
    max_yaw_rate: 2.0
