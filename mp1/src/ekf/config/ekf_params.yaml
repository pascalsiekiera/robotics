# Parameters of the own EKF (ekf_node) and of the ground-truth converter.
# State: [x, y, theta, v, w]. Units: m, rad, s.

ekf_node:
  ros__parameters:
    world_frame: map
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: true            # publishes map -> odom
    publish_rate: 30.0          # Hz, /ekf/odom and TF

    # which sensors to fuse (switch off to compare configurations)
    use_odometry: true
    use_imu: true
    use_ground_truth: true      # if false, starts at initial_pose
    initial_pose: [0.0, 0.0, 0.0]

    # Process noise Q = diag(process_noise) * dt, for [x, y, theta, v, w].
    # x, y, theta: small, the motion model is almost exact for a diff-drive robot.
    # v, w: how fast the velocities may change (random walk), i.e. how much
    #       acceleration we expect between two measurements.
    process_noise: [1.0e-4, 1.0e-4, 1.0e-4, 0.1, 2.0]
    initial_covariance: [0.01, 0.01, 0.01, 0.1, 0.1]

    # Measurement noise (standard deviations).
    # The /odom messages in the bag have zero covariance, so they are set here.
    odom_v_sigma: 0.01          # m/s
    odom_w_sigma: 0.05          # rad/s
    imu_w_sigma: 0.0            # rad/s, <= 0 uses the Imu message covariance (0.02 rad^2/s^2)

    # Mahalanobis outlier rejection (99.9 % chi-square bound).
    # Needed: /odom contains ~10 angular velocity spikes of 100-185 rad/s.
    gate_sensors: true
    gate_ground_truth: true

ground_truth_node:
  ros__parameters:
    world_frame: map
    downsampled_rate: 1.0       # Hz, as required by the assignment
    sigma_xy: 0.02              # m, covariance attached to the 1 Hz ground truth
    sigma_yaw: 0.03             # rad
    # drop mocap samples that jump more than  max_jump + max_rate * dt
    max_jump_xy: 0.05
    max_speed: 0.5
    max_jump_yaw: 0.3
    max_yaw_rate: 2.0
